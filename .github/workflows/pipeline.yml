name: DevOps CI/CD LogiFlow

on:
  push:
    branches: [ "main" ]

jobs:
  ci-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/logiflow-app:latest

  cd-deploy:
    needs: ci-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USER }}/logiflow-app:latest
            sudo docker stop logiflow || true
            sudo docker rm logiflow || true
            sudo docker run -d --name logiflow -p 80:80 ${{ secrets.DOCKER_USER }}/logiflow-app:latest
